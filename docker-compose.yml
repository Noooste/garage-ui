---
services:
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: garage
    volumes:
      - ./garage.toml:/etc/garage.toml
      - ./meta:/var/lib/garage/meta
      - ./data:/var/lib/garage/data
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3903"
      - "3903:3903"

  garage-ui:
    image: noooste/garage-ui:latest
    container_name: garage-ui
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml
      # Holds the JWT signing key generated on first start
      - garage-ui-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - garage
    environment:
      # Garage S3 Configuration
      GARAGE_UI_GARAGE_ENDPOINT: "garage:3900"
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: "http://garage:3903"

      # Server Configuration
      GARAGE_UI_SERVER_HOST: "0.0.0.0"
      GARAGE_UI_SERVER_PORT: "8080"
      GARAGE_UI_SERVER_ENVIRONMENT: "production"

      # JWT signing key: generated on first start and saved in the
      # garage-ui-data volume. To use your own instead, mount it and set
      # GARAGE_UI_AUTH_JWT_PRIVATE_KEY_FILE: /path/to/jwt-key.pem

volumes:
  garage-ui-data:
